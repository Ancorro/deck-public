[package]
name = "deck-tunnel"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "deck-iroh"
path = "src/main.rs"

[dependencies]
iroh = "1.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
strip = true
